name: Lululala Manual Dry Run

on:
  workflow_dispatch:
    inputs:
      use_test_fixture: {description: Use non-publishable deterministic fixture, type: boolean, default: true}
      category: {description: Optional live-research category, type: string, required: false}

permissions: {contents: read}
concurrency:
  group: lululala-kpop-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with: {python-version: "3.12", cache: pip}
      - run: |
          command -v ffmpeg >/dev/null || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python -m pip install -r requirements.txt
      - name: Complete non-publishing render
        env:
          USE_FIXTURE: ${{ inputs.use_test_fixture }}
          CATEGORY: ${{ inputs.category }}
        shell: bash
        run: |
          args=(produce --dry-run --slot "dry-${GITHUB_RUN_ID}")
          [[ "$USE_FIXTURE" == "true" ]] && args+=(--fixture tests/fixtures/verified_topic.json)
          [[ -n "$CATEGORY" ]] && args+=(--category "$CATEGORY")
          python -m src.kpop_automation.cli "${args[@]}"
          test -s output/short.mp4
          python -c "import json; assert json.load(open('output/quality-report.json'))['valid']"
      - uses: actions/upload-artifact@v7
        with:
          name: kpop-dry-run-${{ github.run_id }}
          path: output/
          retention-days: 7
