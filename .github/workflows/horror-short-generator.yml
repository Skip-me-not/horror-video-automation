name: Reddit Horror Video Narrator

on:
  workflow_dispatch:
    inputs:
      debug_artifacts:
        description: Upload diagnostic files
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "7 1 * * *"
    - cron: "7 16 * * *"
    - cron: "7 19 * * *"
    - cron: "7 22 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: reddit-horror-video-narrator
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check or install FFmpeg
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v ffmpeg >/dev/null 2>&1 || ! command -v ffprobe >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --yes ffmpeg
          fi
          ffmpeg -version | head -1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime dependencies
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m yt_dlp --version

      - name: Build Reddit video story
        run: python -m src.reddit_pipeline

      - name: Validate final artifact contract
        run: |
          python -c "import json,pathlib; p=json.loads(pathlib.Path('output/validation.json').read_text()); assert p['valid'], p['errors']"
          test -s output/short.mp4
          test -s output/job.json
          test -s output/source_info.json
          test -s output/selected_story.json
          test -s output/edit_plan.json
          test -s output/hook.json
          test -s output/captions.ass
          test -s output/processing.log

      - name: Upload finished video to YouTube as public
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python scripts/upload_youtube.py \
            --job output/job.json \
            --video output/short.mp4 \
            --privacy public \
            --output output/upload-result.json

      - name: Confirm public upload and record source
        run: |
          python -c "import json,pathlib; p=json.loads(pathlib.Path('output/upload-result.json').read_text()); assert p['status']=='success'; assert p['privacy_status']=='public'; assert p['youtube_video_id']; print('Published:', p['watch_url'])"
          python -m scripts.record_reddit_history
          cat output/upload-result.json >> "$GITHUB_STEP_SUMMARY"

      - name: Persist lightweight duplicate history
        run: |
          if git diff --quiet -- data/history.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "state: record Reddit video [skip ci]"
          git pull --rebase
          git push

      - name: Upload optional diagnostics
        if: success() && github.event_name == 'workflow_dispatch' && inputs.debug_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: reddit-horror-debug-${{ github.run_id }}
          path: |
            output/source_info.json
            output/selected_story.json
            output/hook.json
            output/edit_plan.json
            output/captions.ass
            output/validation.json
            output/upload-result.json
          if-no-files-found: warn
          retention-days: 3

      - name: Remove generated media
        if: always()
        shell: bash
        run: |
          run_temp="$RUNNER_TEMP/reddit-horror"
          if [[ -d "$run_temp" && "$run_temp" == "$RUNNER_TEMP/reddit-horror" ]]; then
            rm -rf "$run_temp"
          fi
          rm -f output/short.mp4 output/narration.mp3 output/word-timings.json output/watermark.txt
