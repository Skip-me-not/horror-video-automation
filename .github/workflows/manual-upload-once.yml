name: One-time manual YouTube upload

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/manual-upload-once.yml

permissions:
  contents: write

concurrency:
  group: horror-script-bank-state
  cancel-in-progress: false

jobs:
  upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      TTS_PROVIDER: edge
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Validate bank
        run: python scripts/validate_bank.py
      - name: Generate and upload HF0001
        run: python scripts/generate_short.py --script-id HF0001
      - name: Persist successful upload state
        if: ${{ success() }}
        run: |
          if git diff --quiet -- data/; then
            echo "No persistent state changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/script_bank.json data/used_scripts.json data/generation_state.json data/performance.json
          git commit -m "state: record uploaded horror Short [skip ci]"
          git push
      - name: Upload diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: manual-upload-${{ github.run_id }}
          path: output/
          retention-days: 2
          if-no-files-found: ignore
