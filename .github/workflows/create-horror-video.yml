name: Create dynamic horror Short

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: Safe job ID (must match payload)
        required: true
        type: string
      job_payload:
        description: Optional base64 JSON job; leave empty to use idea_number
        required: false
        default: ""
        type: string
      idea_number:
        description: Genre-balanced story number (1-180) when job_payload is empty
        required: false
        default: "1"
        type: string
      tts_provider:
        description: Explicit provider; never falls back silently
        required: true
        default: kokoro
        type: choice
        options:
          - kokoro
          - chatterbox

permissions:
  contents: read

concurrency:
  group: horror-video-${{ inputs.job_id }}
  cancel-in-progress: false

jobs:
  create-and-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      TTS_PROVIDER: ${{ inputs.tts_provider }}
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TORCH_HOME: ${{ github.workspace }}/.cache/torch
      TTS_CPU_THREADS: "4"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      N8N_CALLBACK_URL: ${{ secrets.N8N_CALLBACK_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg espeak-ng

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: tts-${{ runner.os }}-py311-${{ inputs.tts_provider }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            tts-${{ runner.os }}-py311-${{ inputs.tts_provider }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.6.0 torchaudio==2.6.0
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Select numbered idea or validate compact job payload
        env:
          JOB_PAYLOAD: ${{ inputs.job_payload }}
          EXPECTED_JOB_ID: ${{ inputs.job_id }}
          IDEA_NUMBER: ${{ inputs.idea_number }}
        run: |
          if [ -n "$JOB_PAYLOAD" ]; then
            python scripts/validate_job.py --payload "$JOB_PAYLOAD" --expected-job-id "$EXPECTED_JOB_ID"
          else
            python scripts/build_job_from_idea.py --idea-number "$IDEA_NUMBER" --job-id "$EXPECTED_JOB_ID"
            python scripts/validate_job.py --job output/idea-job.json --expected-job-id "$EXPECTED_JOB_ID"
          fi

      - name: Generate narration
        run: python scripts/generate_voice.py --job output/job.json --provider "$TTS_PROVIDER"

      - name: Fetch multiple licensed background scenes
        run: python scripts/fetch_background.py --job output/job.json

      - name: Build a script-length visual track
        run: python scripts/prepare_visual_track.py --job output/job.json --narration output/narration.wav

      - name: Generate original continuous horror soundscape and effects
        run: python scripts/generate_sfx.py --job output/job.json --output output/horror-sfx.wav

      - name: Generate original cinematic horror background music
        run: python scripts/generate_music.py --job output/job.json --output output/horror-music.wav

      - name: Render and validate dynamic-length portrait MP4
        run: python scripts/render_video.py --job output/job.json --captions output/captions.ass

      - name: Resolve output filename
        id: rendered
        shell: bash
        run: |
          video_path="$(python -c "import json; print(json.load(open('output/render-report.json'))['output_file'])")"
          echo "video_path=$video_path" >> "$GITHUB_OUTPUT"

      - name: Upload to YouTube as Private
        id: youtube
        run: |
          python scripts/upload_youtube.py --job output/job.json --video "${{ steps.rendered.outputs.video_path }}"

      - name: Notify n8n of success
        if: success()
        run: python scripts/notify_n8n.py --job output/job.json --status success --result output/upload-result.json

      - name: Notify n8n of failure
        if: failure() && hashFiles('output/job.json') != ''
        run: python scripts/notify_n8n.py --job output/job.json --status failure --error "GitHub Actions run failed; inspect the private run logs."

      - name: Upload short-retention diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failed-${{ inputs.job_id }}
          path: |
            output/voice-report.json
            output/background-source.json
            output/visual-track-report.json
            output/sfx-report.json
            output/music-report.json
            output/captions.ass
            output/render-report.json
            output/*.mp4
          retention-days: 1
          if-no-files-found: ignore
