name: Test voice

on:
  workflow_dispatch:
    inputs:
      tts_provider:
        description: Explicit local TTS provider
        required: true
        default: chatterbox
        type: choice
        options:
          - chatterbox
          - kokoro

permissions:
  contents: read

jobs:
  voice-smoke-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      TTS_PROVIDER: ${{ inputs.tts_provider }}
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      TORCH_HOME: ${{ github.workspace }}/.cache/torch
      TTS_CPU_THREADS: "4"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg espeak-ng

      - name: Restore model cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/huggingface
            .cache/torch
          key: tts-${{ runner.os }}-py311-${{ inputs.tts_provider }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            tts-${{ runner.os }}-py311-${{ inputs.tts_provider }}-

      - name: Install Python dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            --index-url https://download.pytorch.org/whl/cpu \
            torch==2.6.0 torchaudio==2.6.0
          python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Create static smoke-test job
        run: |
          python -c "import json,pathlib; p=pathlib.Path('output'); p.mkdir(exist_ok=True); story=('The night watchman heard three slow knocks beneath the floor. ' 'He checked the basement, but the door was still sealed. ' 'When he returned, wet footprints circled his chair, and the telephone whispered his name. ' 'He did not answer. The knocking began again, this time from inside the desk.'); job={'job_id':'voice-smoke','title':'Voice smoke test','story':story,'description':'Local test only','tags':['test'],'background_file':'unused.mp4','privacy_status':'private'}; (p/'smoke-job.json').write_text(json.dumps(job),encoding='utf-8')"

      - name: Generate 20-30 second sample
        run: |
          start=$SECONDS
          python scripts/generate_voice.py --job output/smoke-job.json --provider "$TTS_PROVIDER"
          python -c "import json,pathlib,time; p=pathlib.Path('output/voice-report.json'); d=json.loads(p.read_text()); d['workflow_runtime_seconds']=int('${{ github.run_attempt }}')*0+int('$SECONDS')-int('$start'); p.write_text(json.dumps(d,indent=2))"

      - name: Upload voice sample and report
        uses: actions/upload-artifact@v4
        with:
          name: voice-${{ inputs.tts_provider }}
          path: |
            output/narration.wav
            output/captions.ass
            output/voice-report.json
          retention-days: 1
          if-no-files-found: error
