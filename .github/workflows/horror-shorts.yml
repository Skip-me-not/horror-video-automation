name: Interactive Horror Shorts

on:
  workflow_dispatch:
    inputs:
      game:
        description: Game type; random selects one automatically
        required: false
        type: choice
        options:
          - random
          - choose_door
          - find_ghost
          - spot_change
          - escape_room
          - safe_object
          - moving_entity
      seed:
        description: Optional integer seed for reproducible testing
        required: false
        type: string
      upload:
        description: Upload after validation (default testing mode is false)
        required: true
        default: false
        type: boolean
  schedule:
    # UTC equivalents of 07:00, 12:00, 15:00, and 19:00 Myanmar (UTC+06:30).
    - cron: "30 0 * * *"
    - cron: "30 5 * * *"
    - cron: "30 8 * * *"
    - cron: "30 12 * * *"

permissions:
  contents: write

concurrency:
  group: horror-youtube-upload
  cancel-in-progress: false

jobs:
  generate-render-validate-upload:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      YOUTUBE_PRIVACY_STATUS: ${{ vars.YOUTUBE_PRIVACY_STATUS || 'private' }}
      SHOULD_UPLOAD: ${{ github.event_name == 'schedule' || inputs.upload == true }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install FFmpeg, fonts, and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Generate, render, validate, and optionally upload
        shell: bash
        env:
          INPUT_GAME: ${{ inputs.game }}
          INPUT_SEED: ${{ inputs.seed }}
        run: |
          args=()
          if [[ -n "$INPUT_GAME" && "$INPUT_GAME" != "random" ]]; then args+=(--game "$INPUT_GAME"); fi
          if [[ -n "$INPUT_SEED" ]]; then args+=(--seed "$INPUT_SEED"); fi
          if [[ "$SHOULD_UPLOAD" != "true" ]]; then args+=(--no-upload); fi
          python -m src.main "${args[@]}"
      - name: Commit generation history after an upload attempt succeeds
        if: ${{ success() && (github.event_name == 'schedule' || inputs.upload == true) }}
        run: |
          if git diff --quiet -- data/history.json; then
            echo "No history change to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git commit -m "state: record interactive horror Short [skip ci]"
          git push
      - name: Upload render and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: interactive-horror-${{ github.run_id }}
          path: |
            output/short.mp4
            output/game.json
            output/timeline.json
            output/metadata.json
            output/validation.json
            output/run-report.json
            output/render.log
            output/upload.log
          if-no-files-found: warn
          retention-days: 3
