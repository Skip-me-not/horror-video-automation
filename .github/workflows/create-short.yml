name: Create K-pop entertainment Short

on:
  schedule:
    - cron: "30 21 * * *" # Myanmar time 04:00; one hour before the first peak window
    - cron: "10 22 * * *" # guarded retry at Myanmar time 04:40
    - cron: "30 0 * * *"  # Myanmar time 07:00; one hour before the second peak window
    - cron: "10 1 * * *"  # guarded retry at Myanmar time 07:40
    - cron: "30 3 * * *"  # Myanmar time 10:00; one hour before the third peak window
    - cron: "10 4 * * *"  # guarded retry at Myanmar time 10:40
    - cron: "30 6 * * *"  # Myanmar time 13:00; one hour before the fourth peak window
    - cron: "10 7 * * *"  # guarded retry at Myanmar time 13:40
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render, QA, and save artifacts without uploading"
        required: true
        default: false
        type: boolean
      narration_mode:
        description: "Use supplied narration_file, require it, or render text/music"
        required: true
        default: "auto"
        type: choice
        options: ["auto", "required", "text-only"]
      allow_review:
        description: "Render manual-review stories in dry-run only"
        required: true
        default: false
        type: boolean
      ai_mode:
        description: "Optimize title, hook, subtitle, and CTA with one low-token call"
        required: true
        default: "auto"
        type: choice
        options: ["auto", "off", "required"]

permissions:
  contents: write

concurrency:
  group: youtube-publisher-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      PYTHONUNBUFFERED: "1"
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Lululala' }}
      KPOP_REDDIT_SUBREDDITS: ${{ vars.KPOP_REDDIT_SUBREDDITS || 'kpop' }}
      INPUT_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
      INPUT_NARRATION_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.narration_mode || 'auto' }}
      INPUT_ALLOW_REVIEW: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_review || false }}
      INPUT_AI_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_mode || 'auto' }}
      AI_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
      AI_ENDPOINT: ${{ vars.AI_ENDPOINT || 'https://opencode.ai/inference/go/openai/v1/chat/completions' }}
      AI_MODEL: ${{ vars.AI_MODEL || 'glm-5.3-flash' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg and Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          installed=false
          for attempt in 1 2 3; do
            if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
              installed=true
              break
            fi
            if sudo apt-get update -o Acquire::Retries=3 && sudo apt-get install --yes --no-install-recommends ffmpeg; then
              installed=true
              break
            fi
            echo "FFmpeg installation attempt $attempt failed; retrying" >&2
            sleep $((attempt * 5))
          done
          if [[ "$installed" != "true" ]]; then
            echo "FFmpeg and FFprobe are unavailable after retries" >&2
            exit 1
          fi
          ffmpeg -version | head -n 1
          ffprobe -version | head -n 1
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate configuration and catalogs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then
            python -m scripts.validate_config --mode bl-short
          else
            python -m scripts.validate_config --mode bl-short --require-youtube
          fi

      - name: Run deterministic tests before publication
        run: python -m pytest -q

      - name: Collect, verify, generate, render, and QA
        id: pipeline
        shell: bash
        run: |
          set -euo pipefail
          args=(--narration-mode "$INPUT_NARRATION_MODE" --ai-mode "$INPUT_AI_MODE")
          if [[ "$INPUT_DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          if [[ "$INPUT_ALLOW_REVIEW" == "true" ]]; then
            if [[ "$INPUT_DRY_RUN" != "true" ]]; then
              echo "allow_review is restricted to dry-run mode" >&2
              exit 2
            fi
            args+=(--allow-review)
          fi
          python -m scripts.bl_pipeline "${args[@]}"

      - name: Require a video from manual upload runs
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == false && steps.pipeline.outputs.publish != 'true' }}
        run: |
          echo "Manual upload requested, but the pipeline did not produce a publishable video." >&2
          exit 1

      - name: Upload directly to YouTube as public
        id: youtube
        if: ${{ steps.pipeline.outputs.publish == 'true' }}
        run: python -m scripts.upload_youtube

      - name: Persist publication and rotation state safely
        if: ${{ always() && steps.youtube.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          reddit_snapshot="$RUNNER_TEMP/rendered-reddit-state.json"
          bl_snapshot="$RUNNER_TEMP/rendered-bl-state.json"
          cp data/reddit_state.json "$reddit_snapshot"
          cp data/bl_state.json "$bl_snapshot"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git checkout -B bl-state-update "origin/$GITHUB_REF_NAME"
            python -m scripts.merge_reddit_state data/reddit_state.json "$reddit_snapshot" --output data/reddit_state.json
            python -m scripts.merge_bl_state data/bl_state.json "$bl_snapshot" --output data/bl_state.json
            if git diff --quiet -- data/reddit_state.json data/bl_state.json; then exit 0; fi
            git add data/reddit_state.json data/bl_state.json
            git commit -m "Persist BL publication state [skip ci]"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload dry-run and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kpop-short-${{ github.run_id }}
          path: |
            output/short.mp4
            output/cover.jpg
            output/story.json
            output/package.json
            output/metadata.json
            output/ai_optimization.json
            quality_reports/*.json
            logs/run.json
          if-no-files-found: warn
          retention-days: 2

      - name: Clean temporary output
        if: always()
        run: rm -rf output
