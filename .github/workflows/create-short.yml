name: Create Reddit idol Short

on:
  schedule:
    - cron: "30 22 * * *" # Myanmar time 05:00
    - cron: "30 1 * * *"  # Myanmar time 08:00
    - cron: "30 4 * * *"  # Myanmar time 11:00
    - cron: "30 7 * * *"  # Myanmar time 14:00
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Render and validate without uploading to YouTube"
        required: true
        default: false
        type: boolean
      idol:
        description: "Optional idol; blank rotates data/idols.json"
        required: false
        type: string
      fact_count:
        description: "Number of source-backed story beats"
        required: true
        default: "4"
        type: choice
        options:
          - "4"
          - "3"
      subreddits:
        description: "Comma-separated Reddit communities"
        required: true
        default: "kpop,kpopthoughts,kpop_uncensored"
        type: string

permissions:
  contents: write

concurrency:
  group: reddit-short-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-short:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      REDDIT_USER_AGENT: ${{ vars.REDDIT_USER_AGENT }}
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      CHANNEL_NAME: ${{ vars.CHANNEL_NAME || 'Lululala' }}
      INPUT_IDOL: ${{ github.event_name == 'workflow_dispatch' && inputs.idol || '' }}
      INPUT_FACT_COUNT: ${{ github.event_name == 'workflow_dispatch' && inputs.fact_count || '4' }}
      INPUT_SUBREDDITS: ${{ github.event_name == 'workflow_dispatch' && inputs.subreddits || 'kpop,kpopthoughts,kpop_uncensored' }}
      INPUT_PRIVACY_STATUS: public

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install FFmpeg and Python dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache commercial-safe TTS voice
        uses: actions/cache@v4
        with:
          path: .tts-models
          key: piper-en-US-joe-medium-v1

      - name: Download commercial-safe TTS voice
        run: |
          python -m piper.download_voices --data-dir .tts-models en_US-joe-medium
          test "$(stat -c%s .tts-models/en_US-joe-medium.onnx)" -gt 50000000

      - name: Validate Reddit Short configuration
        run: python -m scripts.validate_config --mode reddit-short --require-youtube

      - name: Render deterministic 55-65 second Short
        id: render
        run: python -m scripts.render_idol_short

      - name: Upload directly to YouTube as public
        id: youtube
        if: ${{ github.event_name == 'schedule' || !inputs.dry_run }}
        run: python -m scripts.upload_youtube

      - name: Persist Reddit source rotation safely
        if: ${{ always() && steps.render.outcome == 'success' && steps.youtube.outcome == 'success' }}
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          snapshot="$RUNNER_TEMP/rendered-reddit-state.json"
          cp data/reddit_state.json "$snapshot"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin "$GITHUB_REF_NAME"
            git checkout -B reddit-state-update "origin/$GITHUB_REF_NAME"
            python -m scripts.merge_reddit_state data/reddit_state.json "$snapshot" --output data/reddit_state.json
            if git diff --quiet -- data/reddit_state.json; then exit 0; fi
            git add data/reddit_state.json
            git commit -m "Persist Reddit source rotation [skip ci]"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1

      - name: Upload render artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reddit-short-${{ github.run_id }}
          path: |
            output/short.mp4
            output/metadata.json
          if-no-files-found: warn
          retention-days: 2

      - name: Clean temporary output
        if: always()
        run: rm -rf output
